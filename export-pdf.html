<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070809">
<title>À L’HEURE — Exporter un mois</title>
<link rel="icon" type="image/png" href="favicon12.png">
<style>
:root{--bg:#070809;--panel:#111419;--panel2:#171a20;--ink:#f5f7fa;--muted:#858b96;--line:rgba(255,255,255,.08);--green:#45e6a0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif}
body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,rgba(69,230,160,.09),transparent 30%),var(--bg)}
.card{width:min(470px,100%);padding:28px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(24,27,32,.96),rgba(12,14,17,.98));box-shadow:0 35px 100px rgba(0,0,0,.4)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:25px}.logo{width:42px;height:42px;border-radius:13px;object-fit:cover}.eyebrow{font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}.title{margin:3px 0 0;font-size:25px;letter-spacing:-1px}
.label{display:block;font-size:10px;color:var(--muted);margin-bottom:8px}.month{width:100%;height:58px;padding:0 15px;border-radius:17px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:17px;font-weight:800;outline:none;color-scheme:dark}.month:focus{border-color:rgba(69,230,160,.45);box-shadow:0 0 0 4px rgba(69,230,160,.08)}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:9px;margin-top:13px}.btn{height:48px;border-radius:15px;border:1px solid var(--line);font-weight:850;cursor:pointer}.cancel{background:rgba(255,255,255,.04);color:var(--ink)}.go{background:#f3f5f7;color:#08090c;border:0}.hint{margin:13px 2px 0;color:var(--muted);font-size:9px;line-height:1.5}
@media(max-width:420px){.card{padding:22px;border-radius:25px}.actions{grid-template-columns:1fr}.title{font-size:22px}}
</style>
</head>
<body>
<main class="card">
  <div class="top"><img class="logo" src="favicon12.png" alt=""><div><div class="eyebrow">À L’HEURE</div><h1 class="title">Exporter un mois</h1></div></div>
  <label class="label" for="month">Choisir le mois à exporter</label>
  <input id="month" class="month" type="month">
  <div class="actions">
    <button class="btn cancel" onclick="window.close()">Annuler</button>
    <button class="btn go" onclick="exporter()">Voir le PDF</button>
  </div>
  <p class="hint">Le PDF est préparé au format A4 avec les mêmes codes visuels que l’application. Depuis l’aperçu, utilise « Enregistrer en PDF ».</p>
</main>
<script>
const now=new Date(),input=document.getElementById("month");
input.value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
function exporter(){if(!input.value)return;location.href="pdf.html?mois="+encodeURIComponent(input.value)}
input.addEventListener("keydown",e=>{if(e.key==="Enter")exporter()});
</script>
</body>
</html>
