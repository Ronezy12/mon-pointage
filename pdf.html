<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>À L’HEURE — Export PDF</title>
<link rel="icon" type="image/png" href="favicon12.png">
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--soft:#f5f6f8}*{box-sizing:border-box}
body{margin:0;background:#eef0f3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
.toolbar{position:sticky;top:0;z-index:5;display:flex;justify-content:center;padding:14px;background:rgba(238,240,243,.9);backdrop-filter:blur(16px)}
.toolbar-inner{width:min(900px,calc(100% - 28px));display:flex;justify-content:space-between;align-items:center;gap:12px}
.toolbar-title{font-weight:800;font-size:13px}.toolbar-sub{color:var(--muted);font-size:10px;margin-top:3px}.actions{display:flex;gap:8px}
button{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.back{background:#fff;border:1px solid var(--line);color:var(--ink)}.print{background:#111827;color:#fff}
.status{width:min(900px,calc(100% - 28px));margin:18px auto;padding:20px;border-radius:16px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:12px}
.sheet{width:210mm;min-height:297mm;margin:18px auto 40px;padding:14mm;background:#fff;box-shadow:0 15px 50px rgba(0,0,0,.12)}
.header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;object-fit:cover}.brand strong{display:block;font-size:18px}.brand span,.period span{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.period{text-align:right}.period span{text-transform:uppercase;letter-spacing:1px}.period strong{display:block;margin-top:4px;font-size:17px;text-transform:capitalize}
.hero{margin:18px 0 20px;padding:20px 22px;border-radius:16px;background:var(--ink);color:#fff}.hero-label{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;opacity:.65}.total{margin-top:6px;font-size:34px;line-height:1;font-weight:850}.note{margin-top:8px;font-size:9px;opacity:.7}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}.box{padding:13px 14px;border:1px solid var(--line);border-radius:12px}.box span{display:block;color:var(--muted);font-size:8px;text-transform:uppercase}.box strong{display:block;margin-top:5px;font-size:15px}
.section-title{margin:0 0 9px;font-size:11px;font-weight:850}table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:8.5px}th,td{padding:7px;border-bottom:1px solid #eef0f2;text-align:left}th{background:var(--soft);color:#4b5563;font-size:7.5px;text-transform:uppercase;letter-spacing:.4px}tr:last-child td{border-bottom:0}.hours{font-weight:850}.status-cell{color:#4b5563}.footer{margin-top:16px;padding-top:9px;border-top:1px solid var(--line);color:#9ca3af;font-size:7.5px;text-align:right}
@media(max-width:800px){.sheet{width:calc(100% - 28px);min-height:auto;padding:24px;margin-top:8px}.summary{grid-template-columns:1fr 1fr}.summary .box:last-child{grid-column:1/-1}}
@media(max-width:520px){.toolbar-inner{align-items:flex-start}.toolbar-sub{max-width:180px}.actions button{padding:10px}.sheet{padding:20px}.total{font-size:29px}table{font-size:7.5px}th,td{padding:6px}}
@media print{@page{size:A4;margin:14mm}body{background:#fff}.toolbar,.status{display:none!important}.sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}.header,.hero,.summary,.section-title{break-inside:avoid}table{break-inside:auto}tr{break-inside:avoid;break-after:auto}}
</style></head>
<body>
<div class="toolbar"><div class="toolbar-inner"><div><div class="toolbar-title">Export PDF</div><div class="toolbar-sub" id="toolbarSub">Préparation du récapitulatif…</div></div><div class="actions"><button class="back" onclick="window.close()">Fermer</button><button class="print" onclick="window.print()">Enregistrer en PDF</button></div></div></div>
<div id="status" class="status">Chargement du récapitulatif…</div><main class="sheet" id="sheet" hidden></main>
<script>
"use strict";
const API="https://script.google.com/macros/s/AKfycbz85SD7D98IEhIInFX-DLI2P9_rer1U_6U2ctYo7bo8s2UgiANmqFVwy2EGPnPfGxpXfQ/exec";let seq=0;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function mins(v){const s=String(v??"").toLowerCase().trim();let m=s.match(/(\d+)h(?:\s*(\d{1,2}))?/);if(m)return +m[1]*60+(+(m[2]||0));m=s.match(/^(\d+):(\d{2})/);return m?+m[1]*60+ +m[2]:0}
function fmt(n){n=Math.max(0,Math.round(n||0));const h=Math.floor(n/60),m=n%60;return h?(h+"h"+(m?" "+String(m).padStart(2,"0"):"")):m+" min"}
function dateLabel(v){const d=v?new Date(v):null;return d&&!isNaN(d)?d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"}):"—"}
function api(action,params){return new Promise((resolve,reject)=>{const token=sessionStorage.getItem("monPointageGoogleToken");if(!token){reject(new Error("Session Google introuvable. Retournez dans l’application et reconnectez-vous."));return}const cb="pdf_"+Date.now()+"_"+(++seq),s=document.createElement("script"),q=new URLSearchParams({action,id_token:token,callback:cb});Object.entries(params||{}).forEach(([k,v])=>q.set(k,String(v)));let done=false;const finish=(fn,v)=>{if(done)return;done=true;clearTimeout(t);delete window[cb];s.remove();fn(v)},t=setTimeout(()=>finish(reject,new Error("Le serveur ne répond pas.")),15000);window[cb]=r=>r?.success?finish(resolve,r):finish(reject,new Error(r?.error||"Erreur API"));s.onerror=()=>finish(reject,new Error("Impossible de contacter le serveur."));s.src=API+"?"+q.toString();document.head.appendChild(s)})}
async function load(){const p=new URLSearchParams(location.search).get("mois")||new Date().toISOString().slice(0,7),parts=p.split("-"),y=Number(parts[0]),m=Number(parts[1]);if(!y||!m)throw new Error("Mois invalide.");const d=new Date(y,m-1,1),label=d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"}),cap=label.charAt(0).toUpperCase()+label.slice(1);document.title="À L’HEURE — "+cap;document.getElementById("toolbarSub").textContent="Récapitulatif de "+cap;const response=await api("obtenirTableauDeBord",{annee:y,mois:m}),data=response.data||{},rows=Array.isArray(data.historique)?data.historique:[],worked=rows.filter(r=>r&&(r.travaille||r.heures)),total=worked.reduce((s,r)=>s+mins(r.travaille||r.heures),0),abs=rows.filter(r=>/absent/i.test(String(r?.statut||""))).length,body=rows.map(r=>"<tr><td>"+esc(dateLabel(r.date))+"</td><td>"+esc(r.debut||"—")+"</td><td>"+esc(r.fin||"—")+"</td><td>"+esc(r.pause||"—")+"</td><td class='hours'>"+esc(r.travaille||r.heures||"—")+"</td><td class='status-cell'>"+esc(r.statut||"—")+"</td></tr>").join("");document.getElementById("sheet").innerHTML="<div class='header'><div class='brand'><img class='logo' src='favicon12.png' alt=''><div><strong>À L’HEURE</strong><span>Suivi des heures de travail</span></div></div><div class='period'><span>Période</span><strong>"+esc(cap)+"</strong></div></div><div class='hero'><div class='hero-label'>Total d'heures effectuées</div><div class='total'>"+esc(fmt(total))+"</div><div class='note'>Cumul des journées enregistrées sur le mois sélectionné</div></div><div class='summary'><div class='box'><span>Jours travaillés</span><strong>"+worked.length+"</strong></div><div class='box'><span>Absences</span><strong>"+abs+"</strong></div><div class='box'><span>Édition</span><strong>"+new Date().toLocaleDateString("fr-FR")+"</strong></div></div><div class='section-title'>Détail des journées</div><table><thead><tr><th>Date</th><th>Arrivée</th><th>Départ</th><th>Pause</th><th>Heures</th><th>Statut</th></tr></thead><tbody>"+(body||"<tr><td colspan='6'>Aucune donnée pour ce mois.</td></tr>")+"</tbody></table><div class='footer'>Document généré depuis À L’HEURE · Récapitulatif mensuel</div>";document.getElementById("status").hidden=true;document.getElementById("sheet").hidden=false}
load().catch(e=>{document.getElementById("status").textContent=e.message||"Impossible de générer le PDF.";document.getElementById("toolbarSub").textContent="Erreur de chargement"});
</script></body></html>
